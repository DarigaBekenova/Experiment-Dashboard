services:
  db:
    ports: !reset []
    restart: unless-stopped
  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      CORS_ORIGINS: '["https://example.kz"]'
  frontend:
    ports: !reset []
    restart: unless-stopped
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
