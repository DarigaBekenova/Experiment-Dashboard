[project]
name = "backend"
version = "0.1.0"
description = "Research WebApp API: experiment dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2",
  "psycopg[binary]>=3",
  "alembic>=1.13",
  "pydantic-settings>=2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
